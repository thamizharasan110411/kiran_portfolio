<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7dc8e"/>
      <stop offset="55%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8952e"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#050607"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- candles -->
  <g opacity="0.5">
    <g transform="translate(0,470)">
      <rect x="60" y="-70" width="16" height="70" fill="url(#gold)" opacity="0.75"/>
      <rect x="110" y="-40" width="16" height="40" fill="none" stroke="#48d6ee" stroke-width="2" opacity="0.7"/>
      <rect x="160" y="-95" width="16" height="95" fill="url(#gold)" opacity="0.75"/>
      <rect x="210" y="-55" width="16" height="55" fill="none" stroke="#48d6ee" stroke-width="2" opacity="0.7"/>
      <rect x="260" y="-120" width="16" height="120" fill="url(#gold)" opacity="0.75"/>
      <rect x="940" y="-80" width="16" height="80" fill="url(#gold)" opacity="0.75"/>
      <rect x="990" y="-45" width="16" height="45" fill="none" stroke="#48d6ee" stroke-width="2" opacity="0.7"/>
      <rect x="1040" y="-110" width="16" height="110" fill="url(#gold)" opacity="0.75"/>
      <rect x="1090" y="-60" width="16" height="60" fill="none" stroke="#48d6ee" stroke-width="2" opacity="0.7"/>
      <rect x="1140" y="-130" width="16" height="130" fill="url(#gold)" opacity="0.75"/>
    </g>
  </g>
  <rect x="0" y="468" width="1200" height="120" fill="url(#fade)" opacity="0.35"/>

  <!-- badge -->
  <rect x="90" y="150" width="150" height="40" rx="20" fill="none" stroke="#d4af37" stroke-opacity="0.5"/>
  <text x="165" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#eecf65" letter-spacing="4">CFD | FUTURES</text>

  <!-- title -->
  <text x="90" y="280" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="#ffffff" letter-spacing="1">TRADING MENTORSHIP</text>
  <text x="90" y="370" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="800" fill="url(#gold)">PROGRAM</text>
  <text x="90" y="440" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="600" fill="#8ce9f8">From Basics to Profitable Trader</text>

  <!-- brand -->
  <text x="90" y="90" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#ffffff" letter-spacing="6">ICT <tspan fill="url(#gold)">KIRAN</tspan></text>
  <text x="1110" y="90" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffffff" opacity="0.55" letter-spacing="5">LEARN | TRADE | GROW</text>
</svg>
